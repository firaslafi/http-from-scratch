apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-server-ingress
  labels:
    app: http-server
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: http-server-svc
                port:
                  name: http